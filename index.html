<!DOCTYPE html>
<html>
<head>
    <title>Energy Tank</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }

        input, button {
            padding: 10px;
            margin: 8px;
            font-size: 16px;
        }

        .card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }

       .bar {
    width: 100%;
    max-width: 900px;
    height: 35px;

    display: flex;

    background: black;

    border: 2px solid white;
    border-radius: 20px;

    overflow: hidden;

    margin: 20px auto;
}

#usedBar {
    width: 0%;
    height: 100%;
    background: white;
    transition: width 0.3s ease;
}

#availableBar {
    width: 0%;
    height: 100%;
    background: #7a7a7a;
    transition: width 0.3s ease;
}
        
    </style>
</head>

<body>

<h1>Energy Tank</h1>

<div class="card">

<h3>Daily Calories</h3>

<input id="dailyCalories" type="number" placeholder="Example: 2000">

<br>

<button onclick="startBank()">Start</button>

</div>


<div class="card">

<h2>Available</h2>

<h1 id="bank">0</h1>

<h3>Used</h3>

<input id="usedCalories" type="number" placeholder="Calories eaten">

<button onclick="useCalories()">Log</button>


<h3>Remaining</h3>

<h2 id="remaining">0</h2>


<div class="bar">
      <div id="usedBar"></div>
    <div id="availableBar"></div>
</div>

</div>


<script>

let dailyCalories = 0;
let usedCalories = 0;


function startBank() {

    dailyCalories = Number(
        document.getElementById("dailyCalories").value
    );

}


function caloriesPerMinute() {

    return dailyCalories / 720;

}


function bankedCalories() {

    let now = new Date();

    let start = new Date();

    start.setHours(9,0,0,0);


    let minutes = (now - start) / 60000;


    if(minutes < 0){
        minutes = 0;
    }


    if(minutes > 720){
        minutes = 720;
    }


    return Math.floor(minutes * caloriesPerMinute());

}


function useCalories(){

    let amount = Number(
        document.getElementById("usedCalories").value
    );


    usedCalories += amount;

}


function update(){

    let bank = bankedCalories();

    document.getElementById("bank").innerHTML = bank;


    let remaining = bank - usedCalories;

    document.getElementById("remaining").innerHTML = remaining;


    let usedPercent = (usedCalories / dailyCalories) * 100;

let availablePercent = ((bank - usedCalories) / dailyCalories) * 100;

if (usedPercent < 0) usedPercent = 0;
if (usedPercent > 100) usedPercent = 100;

if (availablePercent < 0) availablePercent = 0;
if (availablePercent > (100 - usedPercent)) {
    availablePercent = 100 - usedPercent;
}

document.getElementById("usedBar").style.width = usedPercent + "%";
document.getElementById("availableBar").style.width = availablePercent + "%";

}


setInterval(update,1000);

</script>

</body>
</html>
